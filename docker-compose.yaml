version: "3.9"

services:
  dspacedb:
    image: dspace/dspace-postgres-pgcrypto:dspace-9_x
    container_name: dspacedb
    restart: unless-stopped

    environment:
      POSTGRES_DB: dspace
      POSTGRES_USER: dspace
      POSTGRES_PASSWORD: dspace
      PGDATA: /pgdata

    volumes:
      - dspace_pgdata:/pgdata

    ports:
      - "5431:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dspace -d dspace"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - dspacenet

  dspacesolr:
    image: dspace/dspace-solr:dspace-9_x
    container_name: dspacesolr
    restart: unless-stopped

    volumes:
      - dspace_solr:/var/solr/data

    ports:
      - "8983:8983"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8983/solr/ >/dev/null || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

    networks:
      - dspacenet

  dspace-backend:
    image: dspace/dspace:dspace-9.3
    container_name: dspace-backend
    restart: unless-stopped

    depends_on:
      dspacedb:
        condition: service_healthy
      dspacesolr:
        condition: service_healthy

    environment:
      dspace__P__server__P__url: http://localhost:8080/server
      dspace__P__ui__P__url: http://localhost:4000
      dspace__P__server__P__ssr__P__url: http://dspace-backend:8080/server

      db__P__url: jdbc:postgresql://dspacedb:5432/dspace
      db__P__username: dspace
      db__P__password: dspace

      solr__P__server__P__url: http://dspacesolr:8983/solr

      JAVA_OPTS: -Xms512m -Xmx1024m

    ports:
      - "8080:8080"

    volumes:
      - dspace_assetstore:/dspace/assetstore

    networks:
      - dspacenet

networks:
  dspacenet:

volumes:
  dspace_pgdata:
  dspace_solr:
  dspace_assetstore: