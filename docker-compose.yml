include:
  - docker/docker-compose-dist.yml
  - docker/docker-compose-rest.yml

services:
  warp:
    build:
      context: .
      dockerfile: Dockerfile.warp
    image: dspace-warp:local
    container_name: dspace-warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    networks:
      - dspacenet
    healthcheck:
      test: ["CMD", "curl", "-sx", "socks5h://localhost:1080", "--max-time", "10", "https://cloudflare.com/cdn-cgi/trace"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s

  nginx:
    image: nginx:alpine
    container_name: dspace-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dspace
      - dspace-angular
    networks:
      - dspacenet

  dspacedb:
    restart: unless-stopped

  dspacesolr:
    restart: unless-stopped

  dspace:
    restart: unless-stopped
    depends_on:
      warp:
        condition: service_healthy
    environment:
      dspace__P__server__P__url: ${DSPACE_SERVER_URL:-http://localhost/server}
      dspace__P__ui__P__url: ${DSPACE_UI_URL:-http://localhost}
      dspace__P__server__P__ssr__P__url: http://dspace:8080/server
      proxies__P__trusted__P__ipranges: ${PROXIES_TRUSTED_IPRANGES:-172.23.0}

      JAVA_OPTS: >-
        -DsocksProxyHost=warp
        -DsocksProxyPort=1080
        -DsocksNonProxyHosts=dspacedb|dspacesolr|dspace-angular|localhost|127.*|172.*
    volumes:
      - ./config/local.cfg:/dspace/config/local.cfg:ro

  dspace-angular:
    restart: unless-stopped
    image: ${DSPACE_UI_IMAGE:-dspace/dspace-angular:dspace-10.0-dist}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        FRONTEND_REPO: ${FRONTEND_REPO:-https://github.com/DSpace/dspace-angular.git}
        FRONTEND_BRANCH: ${FRONTEND_BRANCH:-main}
    environment:
      DSPACE_UI_SSL: "false"
      DSPACE_UI_HOST: 0.0.0.0
      DSPACE_UI_PORT: 4000
      DSPACE_UI_NAMESPACE: /
      DSPACE_UI_BASEURL: ${DSPACE_UI_URL:-http://localhost}
      DSPACE_REST_SSL: ${DSPACE_REST_SSL:-true}
      DSPACE_REST_HOST: ${DSPACE_REST_HOST:-localhost}
      DSPACE_REST_PORT: ${DSPACE_REST_PORT:-443}
      DSPACE_REST_NAMESPACE: /server
      DSPACE_REST_SSRBASEURL: http://dspace:8080/server

volumes:
  warp-data:
    name: dspace-warp-data
