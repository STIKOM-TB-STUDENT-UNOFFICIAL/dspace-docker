include:
  - docker/docker-compose-dist.yml
  - docker/docker-compose-rest.yml

services:
  warp:
    image: ghcr.io/kingcc/warproxy:latest
    container_name: dspace-warp
    restart: unless-stopped
    environment:
      - SOCKS5_PORT=1080
      - WARP_PLUS=false
    volumes:
      - warp-data:/config   # simpan wgcf-account.toml agar tidak daftar ulang
    networks:
      - dspacenet
    healthcheck:
      test: ["CMD", "curl", "-sx", "socks5h://127.0.0.1:1080", "--max-time", "15", "https://cloudflare.com/cdn-cgi/trace"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: dspace-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dspace
      - dspace-angular
    networks:
      - dspacenet

  dspacedb:
    restart: unless-stopped

  dspacesolr:
    restart: unless-stopped

  dspace:
    restart: unless-stopped
    depends_on:
      warp:
        condition: service_started
    environment:
      dspace__P__server__P__url: ${DSPACE_SERVER_URL:-http://localhost/server}
      dspace__P__ui__P__url: ${DSPACE_UI_URL:-http://localhost}
      dspace__P__server__P__ssr__P__url: http://dspace:8080/server
      proxies__P__trusted__P__ipranges: ${PROXIES_TRUSTED_IPRANGES:-172.23.0}
      # CATATAN: JAVA_OPTS SOCKS proxy dihapus karena merusak koneksi DB/Solr.
      # SMTP sekarang diproxy oleh smtp-relay sidecar.
    volumes:
      - ./config/local.cfg:/dspace/config/local.cfg:ro

  # ─────────────────────────────────────────────────────────────
  # smtp-relay: msmtp daemon - menerima SMTP di port 25 (lokal)
  # dan meneruskan ke Gmail via WARP SOCKS5 proxy (port 443/bypass)
  # DSpace connect ke smtp-relay:25, tidak perlu JAVA_OPTS SOCKS.
  # ─────────────────────────────────────────────────────────────
  smtp-relay:
    build:
      context: .
      dockerfile: Dockerfile.smtp-relay
    container_name: dspace-smtp-relay
    restart: unless-stopped
    depends_on:
      warp:
        condition: service_started
    environment:
      # Kredensial Gmail - edit sesuai akun Anda
      SMTP_USER: ${SMTP_USER:-emailanda@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-xxxx-xxxx-xxxx-xxxx}
      SMTP_FROM: ${SMTP_FROM:-noreply@repository.stikomtunasbangsa.ac.id}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
    networks:
      - dspacenet
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "25"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  dspace-angular:
    restart: unless-stopped
    image: ${DSPACE_UI_IMAGE:-dspace/dspace-angular:dspace-10.0-dist}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        FRONTEND_REPO: ${FRONTEND_REPO:-https://github.com/DSpace/dspace-angular.git}
        FRONTEND_BRANCH: ${FRONTEND_BRANCH:-main}
    environment:
      DSPACE_UI_SSL: "false"
      DSPACE_UI_HOST: 0.0.0.0
      DSPACE_UI_PORT: 4000
      DSPACE_UI_NAMESPACE: /
      DSPACE_UI_BASEURL: ${DSPACE_UI_URL:-http://localhost}
      DSPACE_REST_SSL: ${DSPACE_REST_SSL:-true}
      DSPACE_REST_HOST: ${DSPACE_REST_HOST:-localhost}
      DSPACE_REST_PORT: ${DSPACE_REST_PORT:-443}
      DSPACE_REST_NAMESPACE: /server
      DSPACE_REST_SSRBASEURL: http://dspace:8080/server

volumes:
  warp-data:
    name: dspace-warp-data

