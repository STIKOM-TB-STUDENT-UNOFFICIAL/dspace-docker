include:
  - docker/docker-compose-dist.yml
  - docker/docker-compose-rest.yml

services:
  nginx:
    image: nginx:alpine
    container_name: dspace-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dspace
      - dspace-angular
    networks:
      - dspacenet

  dspace:
    environment:
      dspace__P__server__P__url: ${DSPACE_SERVER_URL:-http://localhost/server}
      dspace__P__ui__P__url: ${DSPACE_UI_URL:-http://localhost}
      dspace__P__server__P__ssr__P__url: http://dspace:8080/server
      # SMTP Email Configurations
      dspace__P__mail__P__server: ${SMTP_HOST:-smtp.gmail.com}
      dspace__P__mail__P__server__P__port: ${SMTP_PORT:-587}
      dspace__P__mail__P__server__P__username: ${SMTP_USER:-}
      dspace__P__mail__P__server__P__password: ${SMTP_PASS:-}
      dspace__P__mail__P__server__P__disabled: ${SMTP_DISABLED:-true}
      dspace__P__mail__P__from__P__address: ${SMTP_FROM_ADDRESS:-noreply@repository.stikomtunasbangsa.ac.id}
      dspace__P__mail__P__feedback__P__recipient: ${SMTP_FEEDBACK_RECIPIENT:-admin@repository.stikomtunasbangsa.ac.id}
      dspace__P__mail__P__admin: ${SMTP_ADMIN_EMAIL:-admin@repository.stikomtunasbangsa.ac.id}

  dspace-angular:
    image: ${DSPACE_UI_IMAGE:-dspace/dspace-angular:latest-dist}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        FRONTEND_REPO: ${FRONTEND_REPO:-https://github.com/DSpace/dspace-angular.git}
        FRONTEND_BRANCH: ${FRONTEND_BRANCH:-main}
    environment:
      DSPACE_UI_SSL: "false"
      DSPACE_UI_HOST: 0.0.0.0
      DSPACE_UI_PORT: 4000
      DSPACE_UI_NAMESPACE: /
      DSPACE_UI_BASEURL: ${DSPACE_UI_URL:-http://localhost}
      DSPACE_REST_SSL: ${DSPACE_REST_SSL:-true}
      DSPACE_REST_HOST: ${DSPACE_REST_HOST:-localhost}
      DSPACE_REST_PORT: ${DSPACE_REST_PORT:-443}
      DSPACE_REST_NAMESPACE: /server
      DSPACE_REST_SSRBASEURL: http://dspace:8080/server
