include:
  - docker/docker-compose-dist.yml
  - docker/docker-compose-rest.yml

networks:
  dspacenet:
    external: false

services:
  nginx:
    image: nginx:alpine
    container_name: dspace-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dspace
      - dspace-angular
    networks:
      - dspacenet

  dspace:
    environment:
      dspace__P__server__P__url: ${DSPACE_SERVER_URL:-http://localhost/server}
      dspace__P__ui__P__url: ${DSPACE_UI_URL:-http://localhost}
      dspace__P__server__P__ssr__P__url: http://dspace:8080/server

  dspace-angular:
    environment:
      DSPACE_UI_HOST: ${DSPACE_UI_HOST:-localhost}
      DSPACE_UI_PORT: ${DSPACE_UI_PORT:-80}
      DSPACE_UI_BASEURL: ${DSPACE_UI_URL:-http://localhost}
      DSPACE_REST_HOST: ${DSPACE_REST_HOST:-localhost}
      DSPACE_REST_PORT: ${DSPACE_REST_PORT:-80}
      DSPACE_REST_NAMESPACE: /server
      DSPACE_REST_SSRBASEURL: http://dspace:8080/server
