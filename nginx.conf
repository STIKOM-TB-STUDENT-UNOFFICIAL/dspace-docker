server {
    listen 80;
    server_name _;

    client_max_body_size 1024M;

    # Ambil proto dari upstream proxy (Cloudflare/Nginx kampus),
    # fallback ke scheme lokal jika tidak ada header X-Forwarded-Proto.
    set $proto $http_x_forwarded_proto;
    if ($proto = "") {
        set $proto $scheme;
    }

    location /server/ {
        proxy_pass http://dspace:8080/server/;

        proxy_set_header Host                $http_host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $proto;
        proxy_set_header X-Forwarded-Host    $http_host;

        proxy_set_header Cookie              $http_cookie;
        proxy_pass_header Set-Cookie;

        proxy_connect_timeout 120s;
        proxy_read_timeout    300s;
        proxy_send_timeout    120s;

        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      4 32k;
    }

    location / {
        proxy_pass http://dspace-angular:4000;

        proxy_set_header Host                $http_host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $proto;
        proxy_set_header X-Forwarded-Host    $http_host;
        
        proxy_set_header Cookie              $http_cookie;
        proxy_pass_header Set-Cookie;

        proxy_http_version 1.1;
        proxy_set_header Upgrade             $http_upgrade;
        proxy_set_header Connection          "upgrade";

        proxy_connect_timeout 120s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}