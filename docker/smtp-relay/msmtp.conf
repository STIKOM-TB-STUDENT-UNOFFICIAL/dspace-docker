# /etc/msmtprc — konfigurasi msmtp
# Kredensial Gmail diambil dari environment variable saat entrypoint.sh start.
# File ini di-overwrite oleh entrypoint.sh dengan nilai aktual.

defaults
auth           on
tls            on
tls_trust_file /etc/ssl/certs/ca-certificates.crt
logfile        /var/log/msmtp.log

account        gmail
host           smtp.gmail.com
port           587
from           noreply@example.com
user           user@gmail.com
password       app-password-here

account default : gmail
